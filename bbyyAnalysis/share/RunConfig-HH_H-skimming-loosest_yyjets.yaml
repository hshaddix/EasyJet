include: [bbyyAnalysis/RunConfig-HH_H-base.yaml]

# flag that toggles run-through mode in the SelectorAlg
bypass: false

# name that will go in the tree bbyy_pass_<selection_name>_%SYS%
selection_name: "loosest"

# removing trigger matching for now
CutList :
      - PASS_TRIGGER
      - DIPHOTON_MASS

save_cutflow: true

do_event_cleaning: true

Small_R_jet:
  gn3_scores: true
Truth:
  do_STXS: false

ttree_output:
  reco_outputs:
      small_R_jets: 'container_names.output.reco4PFlowJet'
  collection_options:
    small_R_jets:
      no_bjet_calib_p4: true