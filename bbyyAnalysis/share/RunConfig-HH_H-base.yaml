include: [bbyyAnalysis/RunConfig-bbyy-base.yaml]

# Which analysis to consider
do_HHbbyy_Hyy_Analysis: true

# Toggles for object types
do_GNN2bjetSelection: true

do_KinematicFit: true
extra_KinematicFit_variables: true

TopReconstruction:
  BDT_path: "bbyyAnalysis/model_topRecoBDT.root"

# Toggle for ggH bjet filter
do_ggHbjetFilter: true

# Toggle for event cleaning
do_event_cleaning: false
dump_event_cleaning_info: true

# bdt models used for categorisation and VBF jets selection
# They should appear in this order lowMass / highMass / VBF jets

do_nonresonant_BDTs: true
save_VBF_vars: true
save_extra_vars: true
save_nonresonant_BDTInput_variables: true
save_HbbCand_vars: true

BDT_path:
  - "bbyyAnalysis/bdt_legacy_lowMass.root"
  - "bbyyAnalysis/bdt_legacy_highMass.root"
  - "bbyyAnalysis/bdt_legacy_vbf_jets.root"
  - "bbyyAnalysis/bdt_HH2025_KF_no_corr_no_Data2024_run2_lowMass.root" #For Higgs Pairs 2025 version with KF
  - "bbyyAnalysis/bdt_HH2025_KF_no_corr_no_Data2024_run2_highMass.root"
  - "bbyyAnalysis/bdt_HH2025_KF_no_corr_no_Data2024_run3_lowMass.root"
  - "bbyyAnalysis/bdt_HH2025_KF_no_corr_no_Data2024_run3_highMass.root"
  - "bbyyAnalysis/bdt_HH2025_KF_no_corr_Data2024_run3_lowMass.root" #Run 3 model with 2024 included
  - "bbyyAnalysis/bdt_HH2025_KF_no_corr_Data2024_run3_highMass.root"
  - "bbyyAnalysis/bdt_HH2025_KF_corr_no_Data2024_lowMass.root" #Run 2 and 3 combined model
  - "bbyyAnalysis/bdt_HH2025_KF_corr_no_Data2024_highMass.root"
  - "bbyyAnalysis/bdt_HH2025_KF_corr_Data2024_lowMass.root" #Run 2 and 3 combined model with 2024
  - "bbyyAnalysis/bdt_HH2025_KF_corr_Data2024_highMass.root"
  - "bbyyAnalysis/bdt_HH2025_no_KF_no_corr_no_Data2024_run2_lowMass.root" #For Higgs Pairs 2025 version without KF
  - "bbyyAnalysis/bdt_HH2025_no_KF_no_corr_no_Data2024_run2_highMass.root"
  - "bbyyAnalysis/bdt_HH2025_no_KF_no_corr_no_Data2024_run3_lowMass.root"
  - "bbyyAnalysis/bdt_HH2025_no_KF_no_corr_no_Data2024_run3_highMass.root"

GNN_path_run2:
  - "bbyyAnalysis/GNN_ggFTarget_run2.onnx"
  - "bbyyAnalysis/GNN_VBFTarget_run2.onnx"

GNN_path_run3:
  - "bbyyAnalysis/GNN_ggFTarget_run3.onnx"
  - "bbyyAnalysis/GNN_VBFTarget_run3.onnx"

# Transformer-based event categorisation model
do_Transformer_categorisation: true
Transformer_categorisation_path: "bbyyAnalysis/bbyyTransformerV01.onnx"
Transformer_categorisation_io_path: "bbyyAnalysis/bbyyTransformerV01_io.json"

#  choose VBF jets selection method

save_detailed_Input_variables: true
do_Hyy_multiclass: false

HyyMultiBDT_folder: "bbyyAnalysis/HyyMultiBDT"
HyyMultiBDT_config:
  include: [bbyyAnalysis/HyyHHbbyyMVAAlg.yaml]
Hyy_multiclass_bins: ["GG2H_0J_PTH_0_10", "GG2H_0J_PTH_GT10",
                      "GG2H_1J_PTH_0_60", "GG2H_1J_PTH_60_120", 
                      "GG2H_1J_PTH_120_200", "GG2H_GE2J_MJJ_0_350_PTH_0_60", 
                      "GG2H_GE2J_MJJ_0_350_PTH_60_120", "GG2H_GE2J_MJJ_0_350_PTH_120_200", 
                      "GG2H_GE2J_MJJ_350_700_PTH_0_200", "GG2H_GE2J_MJJ_700_1000_PTH_0_200",
                      "GG2H_GE2J_MJJ_GT1000_PTH_0_200", "GG2H_PTH_200_300", 
                      "GG2H_PTH_300_450", "GG2H_PTH_450_650", 
                      "GG2H_PTH_GT650",

                      "QQ2HQQ_0J", "QQ2HQQ_1J", 
                      "QQ2HQQ_GE2J_MJJ_0_60", "QQ2HQQ_GE2J_MJJ_60_120",
                      "QQ2HQQ_GE2J_MJJ_120_350",  "QQ2HQQ_GE2J_MJJ_350_700_PTH_0_200",
                      "QQ2HQQ_GE2J_MJJ_700_1000_PTH_0_200", "QQ2HQQ_GE2J_MJJ_GT1000_PTH_0_200",
                      "QQ2HQQ_GE2J_MJJ_350_700_PTH_GT200", "QQ2HQQ_GE2J_MJJ_700_1000_PTH_GT200",
                      "QQ2HQQ_GE2J_MJJ_GT1000_PTH_GT200", 
                      
                      "QQ2HLNU_PTV_0_75", "QQ2HLNU_PTV_75_150", 
                      "QQ2HLNU_PTV_150_250", "QQ2HLNU_PTV_GT250",
                      
                      "QQ2HLL_PTV_0_75", "QQ2HLL_PTV_75_150",
                      "QQ2HLL_PTV_150_250", "QQ2HLL_PTV_GT250",
                      
                      "QQ2HNUNU_PTV_0_75", "QQ2HNUNU_PTV_75_150",
                      "QQ2HNUNU_PTV_150_250", "QQ2HNUNU_PTV_GT250",
                      
                      "TTH_PTH_0_60", "TTH_PTH_60_120",
                      "TTH_PTH_120_200", "TTH_PTH_200_300", "TTH_PTH_GT300",
                      "THJB", "THW"]

always_do_CBK_systematics: true
