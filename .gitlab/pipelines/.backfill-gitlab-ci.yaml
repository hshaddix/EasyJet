###########################################################
# Special job created because the CI now depends on which
# analysis package was touched. We need to copy over the
# reference files for packages that were not touched.
###########################################################
# Common prerequisites shared by backfill job.
.backfill_prerequisites:
  needs:
    - job: get-latest-merged-mr
      artifacts: true
    - job: compile
      artifacts: true

backfill:
  variables:
    GIT_STRATEGY: none
  rules:
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_PROJECT_PATH == 'easyjet/easyjet'"
  stage: backfill
  tags:
    - k8s-eos
  needs:
    - !reference [.backfill_prerequisites, needs]
  script:
    - easyjet-backfill
