.ntuple_validation:
  variables:
    GIT_STRATEGY: none
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_PROJECT_PATH == 'easyjet/easyjet'
  stage: validate
  tags:
    - k8s-eos
  artifacts:
    paths:
      - branch-diff-log.txt
    expire_in: 1 week
  allow_failure:
    exit_codes: # in order of severity
      - 22 # branch diff
      - 23 # branch removed
      - 24 # branch added

# Common prerequisites shared by all validator jobs.
.validator_prerequisites:
  needs:
    - job: get-latest-merged-mr
      artifacts: true
    - job: compile
      artifacts: true

# Data

validator_fast_data18:
  extends: .ntuple_validation
  needs:
    - !reference [.validator_prerequisites, needs]
    - job: ntupler_fast_data18
      artifacts: false
  script:
    - easyjet-validate fast-data18

