variables:
  # needed to propagate the exit code from the script to the CI
  FF_USE_NEW_BASH_EVAL_STRATEGY: true

.if_to_central: &if_to_central
  "$CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_PROJECT_PATH == 'easyjet/easyjet'"

.rule_core_pkgs: &rule_core_pkgs
  if: "$CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_PROJECT_PATH == 'easyjet/easyjet'"
  changes:
    - "EasyjetHub/**/*"
    - "EasyjetTests/**/*"
    - ".gitlab-ci.yml"

.changes_bbbb: &changes_bbbb
  rules:
    - if: *if_to_central
      changes: ["bbbbAnalysis/**/*"]
    - <<: *rule_core_pkgs

.changes_bbbbtt: &changes_bbbbtt
  rules:
    - if: *if_to_central
      changes: ["bbbbttAnalysis/**/*"]
    - <<: *rule_core_pkgs

.changes_bbbbbb: &changes_bbbbbb
