variables:
  GIT_SUBMODULE_STRATEGY: recursive

###########################################################
# Wipe this MR's own eos ntuples directory before the run stage
# starts. This guarantees that by the time the backfill job
# runs, any file already present in that directory was freshly produced 
# by this MR's own pipeline, and # anything else needs to be copied over 
# from the reference MR.  
# Without this, a file backfilled in a previous pipeline run of this 
# MR (e.g. from an older reference) could linger and be mistaken for
# fresh output.
###########################################################
clean-mr-eos-dir:
  rules:
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_PROJECT_PATH == 'easyjet/easyjet'"
  stage: build
  tags:
    - k8s-eos
  needs: []
  # not compiled/installed yet at this point in the pipeline (this job
  # must run before compile), call it explicitly
  script:
    - EasyjetTests/bin/easyjet-clean-mr-dir

cmake:
  stage: build
  script:
    - mkdir -p build
    - EasyjetTests/bin/make-package-filter
    - cd build
    - cmake .. -DATLAS_PACKAGE_FILTER_FILE=$(pwd)/package_filters.txt
        | tee cmake.log
  artifacts:
    paths:
      - build
    expire_in: 1 week
  needs: []

compile:
  stage: build
  script:
    - cd build
    - make clean # make sure we don't have residual compilation results
    - make -j $(nproc) 2>&1 | tee -a cmake.log # dump the log files
    - cd ..
    - mv build builtmp
    - cp -rL builtmp build  ### copy all symlinks to avoid clone in each test job, did not find a way to force cmake to avod symlinks for now
    - rm -rf builtmp
  artifacts:
    paths:
      - build
    reports:
      dotenv: build/build_packages.env
    expire_in: 1 week
  needs:
    - cmake
    - job: clean-mr-eos-dir
      optional: true

clang_tidy:
  stage: build
  tags:
    - cvmfs
  before_script:
    - env
    - cd build
  script: # not compiled yet in the CI, the script is not yet installed, call it explicitly
    - pwd
    - ls
    - ls ..
    - ../EasyjetTests/bin/easyjet-clang-tidy ../
  needs: [cmake]
  rules:
    - if: $ENABLE_FORMATTERS