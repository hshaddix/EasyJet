# test without eos or cvmfs run, intentionally doesn't include cvmfs
# and pretends not to have EOS credentials

test_eos_free:
 stage: run
 needs: [compile]
 rules:
   - if: $EASYJET_PKG_XbbCalib
 script:
   - EASYJET_FAKE_MISSING_EOS=1 easyjet-test zbbycalib-mc23

# metatests

test_fail:
  tags:
    - cvmfs
  stage: run
  needs: [compile]
  script:
    - (! easyjet-test fail)

test_all:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_PROJECT_PATH == 'easyjet/easyjet'
  tags:
    - cvmfs
  stage: run
  needs: [compile]
  script:
    - EASYJET_METATEST=true easyjet-test all
