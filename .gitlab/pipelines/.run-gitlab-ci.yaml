# non-ntupler workflows
#
# These jobs can run on any fork: they should be independent of:
# - the central easyjet instance
# - any secrets or login credentials
# - eos
# Technically they don't require cvmfs either, but we allow specify access
# anyway because loading calibration via cvmfs is less strain than via https.
aod_fast_bbbb_mc23:
  tags:
    - cvmfs
  stage: run
  needs: [compile]
  rules:
    - if: $EASYJET_PKG_bbbbAnalysis
  script:
    - easyjet-test aod-fast-bbbb-mc23

