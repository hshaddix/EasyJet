variables:
  # overrides the log level in easyjet-test
  EASYJET_LOG_LEVEL: INFO
  # default test directory for easyjet-test, can be overridden by -d
  EASYJET_TESTDIR: ci_testdir

.if_to_central: &if_to_central
  "$CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_PROJECT_PATH == 'easyjet/easyjet'"

.rule_core_pkgs: &rule_core_pkgs
  if: "$CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_PROJECT_PATH == 'easyjet/easyjet'"
  # kept in sync with core_regex in EasyjetTests/bin/easyjet-changed-packages
  changes:
    - "EasyjetHub/**/*"
    - "EasyjetTests/**/*"
    - "KinematicFitTool/**/*"
    - "VBFTagger/**/*"
    - "TruthWeightTools/**/*"
    - "ONNXInferenceTool/**/*"
    - ".gitlab-ci.yml"

.ntupler:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_PROJECT_PATH == 'easyjet/easyjet'
  variables:
    GIT_STRATEGY: none
  stage: run
  needs: [compile]
  # Safety net: the changes:-based rules above can be stale after a
  # rebase and trigger a job whose package didn't actually get
  # compiled (see EASYJET_REQUIRED_PKG on the .changes_* anchors).
  # Skip cleanly instead of failing on a missing binary.
  before_script:
    - git config --global lfs.concurrenttransfers 3 # Default is 8.
    - git config --global lfs.transfer.maxretries 3 # Default is 8.
    - set -e # exits the pipeline if one of the jobs don't return 0
    - source ~/release_setup.sh
    - if [[ -d build ]]; then source build/**/setup.sh; fi
    - env
    - |
      if [[ -n "${EASYJET_REQUIRED_PKG:-}" ]]; then
        var="EASYJET_PKG_${EASYJET_REQUIRED_PKG}"
        if [[ -z "${!var:-}" ]]; then
          echo "Package ${EASYJET_REQUIRED_PKG} was not compiled for this MR, skipping."
          exit 0
        fi
      fi
  tags:
    - k8s-eos
    - cvmfs
  artifacts:
    paths:
      - $EASYJET_TESTDIR/output-branches-analysis.txt
      - $EASYJET_TESTDIR/userJobMetadata.json
    expire_in: 1 week

.changes_bbbb: &changes_bbbb
  rules:
    - if: *if_to_central
      changes: ["bbbbAnalysis/**/*"]
    - <<: *rule_core_pkgs
  variables:
    EASYJET_REQUIRED_PKG: bbbbAnalysis

.changes_bbbbtt: &changes_bbbbtt
  rules:
    - if: *if_to_central
      changes: ["bbbbttAnalysis/**/*"]
    - <<: *rule_core_pkgs
  variables:
    EASYJET_REQUIRED_PKG: bbbbttAnalysis

.changes_bbbbbb: &changes_bbbbbb
