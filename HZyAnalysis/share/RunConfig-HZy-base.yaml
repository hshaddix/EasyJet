include: EasyjetHub/base-config.yaml

# which analysis to consider
do_HZy_analysis: true

# Whether to activate CP alg systematic variations
do_CP_systematics: false
systematics_regex: []

do_small_R_jets: true
do_photons: true
do_electrons: true
do_muons: true
do_met: true

# Toggles for reconstructed objects decorations
Small_R_jet:
  min_pT: 25.e+3
  max_eta: 4.4
  useFJvt: true
  # btagging nominal working point
  btag_wp: "GN2v01_FixedCutBEff_85"
  # to use multiple btagging WPs
  btag_extra_wps:
    - GN2v01_Continuous

Photon:
  min_pT: 10.e+3
  ID: "Loose"
  Iso: "NonIso"
  variables_int: ["isEMTight"]
  extra_wps:
    - ["Tight", "NonIso"] 
    - ["Tight", "FixedCutLoose"]
  do_truth_matching: true
  do_conversion_decoration: true

Electron:
  min_pT: 10.e+3
  ID: "LooseBLayerLH"
  Iso: "NonIso"
  correlationModelId: "TOTAL"
  extra_wps:
    - ["MediumLH", "NonIso"]
    - ["LooseBLayerLH", "Loose_VarRad"]

Muon:
  min_pT: 5.e+3
  max_eta: 2.5
  ID: "Medium"
  Iso: "NonIso"
  extra_wps:
    - ["Medium", "Loose_VarRad"]

Lepton:
  amount: -1

Met:
  saveSignificance: true

# apply trigger lists to filter events
do_trigger_filtering: false

# flag for event cleaning
do_event_cleaning: false

# Require the events pass the global multi-leg trigger matching, using the
# TrigGlobalEfficiencyCorrection tool/alg. Only for electron/muon/photon triggers
do_trigger_match_filtering: false
# list of triggers per year to consider
Trigger:
  include: HZyAnalysis/trigger.yaml
  writeOutput: true

# specific overlap removal settings for HZy analysis, 
# which are different from the default ones in Athena
HZy_OR:
  # Leptons overlap removal settings (electrons and muons)
  do_lepton_overlap_removal: true
  lep_thr:
    dEta_ElEl: 0.075
    dPhi_ElEl: 0.125
    dR_El_StacoMu: 0.02
    dR_StacoMu_StacoMu: 0.0
    dR_CaloMu_StacoMu: 0.1
    dR_CaloMu_Electron: 0.2
  # Photons and jets between leptons overlap removal settings
  do_photonjet_overlap_removal: true
  phjet_thr:
    dR_Ph_El: 0.3
    dR_Ph_CaloMu: 0.3
    dR_Ph_StacoMu: 0.3
    dR_Jet_Ph: 0.2
    dR_Jet_El: 0.2
    dR_Jet_CaloMu: 0.2
    dR_Jet_StacoMu: 0.2

# Selections for FSR correction
fsr_selections:
  mll_window_infsr: [66.0, 89.0]
  mll_fsr_threshold: 100.0

# Selections on dilepton and photon kinematics
mass_relpt_cuts:
  max_mll_veto_hmumu: 101.0
  mll_cstr_window: [81.18, 101.18]
  mllg_cstr_window: [115.0, 170.0]
  photon_relpt_min: 0.09

# Use constrained Z mass to select the best candidate (if false, use raw mass). 
# Constrained mass will be set to raw mass if fit fails.
useConstrainedZMass: true

# Store high level variables by default
# when the config file set the high level variables
store_high_level_variables: true

# flag that toggles run-through mode in SelectorAlg
bypass: false

# Enable cutflow
save_cutflow: true

# name that will go in the tree HZy_pass_<selection_name>_%SYS%
selection_name: "allcuts"

# Use a common GRL for HZy due to lepton triggers
GRL:
  years:
    include: HZyAnalysis/Zy_grl_years.yaml
  files:
    include: HZyAnalysis/Zy_grl.yaml

PileupReweighting:
  lumicalc_files:
    include: HZyAnalysis/lumicalc_lepton.yaml
  prw_files:
    include: HZyAnalysis/prw_lepton.yaml
  extra_prw:
    - postfix: "lepton"

ttree_output:
  include: HZyAnalysis/HZy-base-output.yaml
