include: EasyjetHub/AnalysisMiniTree-config.yaml
# Our overrides. All defaults are off
reco_outputs:
  small_R_jets: "container_names.output.reco4PFlowJet"
  photons: "container_names.output.photons"
  electrons: "container_names.output.electrons"
  muons: "container_names.output.muons"
collection_options:
  small_R_jets:
    btag_details: true
    btag_info: true
    truth_parent_info: false
    run_selection: true

  photons:
    shower_shapes: false
    truth_labels: true
    iso_variables: false
    run_selection: true
    extra_variables: []
    mc_extra_variables: []

  electrons:
    iso_variables: false
    id_variables: false
    run_selection: true
    truth_parent_info: true
    extra_variables: []
    mc_extra_variables: []

  muons:
    iso_variables: false
    run_selection: true
    truth_parent_info: true
    extra_variables: []
    mc_extra_variables: []
