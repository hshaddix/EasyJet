include: [bbbbbbAnalysis/RunConfig-bbbbbb-base.yaml]

# Which analysis to consider
# Current strategy could lead to super large output
# with all syst on
do_resolved_trihiggs: true

do_resolved_trigger_SF: true
triggerSFBranchSaveStrategy: "simple" # detail, simple, both
do_resolved_trigger_bucket: true

pairingStrategy: "minTargetMass"

# Toggles for object types
do_small_R_jets: true
do_large_R_UFO_jets: true
do_muons: true
do_met: true
do_taus: true

Small_R_jet:
  min_pT: 10.e+3
  max_eta: 4.5
  btag_wp: "GN2v01_FixedCutBEff_90"
  btag_extra_wps:
    - GN2v01_FixedCutBEff_70
    - GN2v01_FixedCutBEff_77
    - GN2v01_FixedCutBEff_85
  doL1Matching: false
  doHLTMatching: false
  saveTriggerInfo: true

Large_R_jet:
  min_pT: 200.e+3
  max_pT: 3000.e+3
  max_eta: 2.0
  runMuonJetPtCorr: true
  amount_leadingjet: 3
  flat_mass_selections:
    include: [EasyjetHub/xbb-taggers/GN3XPV01_hbb.yaml]

Muon:
  ID: "Loose"
  Iso: "PflowLoose_VarRad"

Tau:
  ID: "Baseline"

# list of triggers per year to consider
Trigger:
  selection:
    include: [bbbbbbAnalysis/triggers-resolved.yaml]
  scale_factor:
    jet:
      include: [bbbbbbAnalysis/triggers-resolved.yaml]

# can alternatively use the CutList to filter events to get trigger eff
do_trigger_filtering: true
bypass: false
save_cutflow: true
selection_name: "preselection"
CutList:
  - PASS_TRIGGER
  - AT_LEAST_SIX_JETS
  # - AT_LEAST_FOUR_BJETS
  # - AT_LEAST_SIX_BJETS
  # - AT_LEAST_FOUR_JETS_OR_TWO_LRJETS
  # - AT_LEAST_SIX_JETS_OR_THREE_LRJETS
  # - AT_LEAST_SIX_JETS_TWO_BJETS

do_overlap_removal: false

do_CP_systematics: false
systematics_regex: [".*"]

Exclude2015: true

GRL:
  years:
    include: [EasyjetHub/bjet_grl_years.yaml]

PileupReweighting:
  extra_prw:
    - postfix: "bjet"
      lumicalc_files:
        include: [EasyjetHub/lumicalc_bjet.yaml]
      prw_files:
        include: [EasyjetHub/prw_bjet.yaml]

# Include the TTree configuration and update details
ttree_output:
  # Our overrides. All defaults are off
  reco_outputs:
    small_R_jets: 'container_names.output.reco4PFlowJet'
    large_R_UFO_jets: 'container_names.output.reco10UFOJet'
    met: 'container_names.output.met'
    taus: 'container_names.output.taus'
  collection_options:
    small_R_jets:
      truth_parent_info: true
      btag_info: true
      JVT_details: true
      no_bjet_calib_p4: true
      btag_details: true
      gn3_scores: false
    large_R_jets:
      truth_labels: true
      substructure_info: true
      no_bjet_calib_p4: true
      run_selection: true
      bjet_regression: true
    taus:
      run_selection: true


  truth_outputs:
    small_R_jets: 'container_names.input.truth4Jet'
    large_R_jets: 'container_names.input.truth10SoftDropJet'
    higgs_particle: 'container_names.output.truthHHParticles'