# `include` must be a list (combineConfigFiles / TextConfig)
include: [bbbbbbAnalysis/RunConfig-bbbbbb-base.yaml]

# Which analysis to consider
# Current strategy could lead to super large output
# with all syst on
do_resolved_trihiggs: true

do_resolved_trigger_SF: true
# Option to switch stored level of trigger SF: detail, simple, both
triggerSFBranchSaveStrategy: "simple"

# Ntuple/TriggerDecorator only run when at least one of Small_R_jet doL1Matching / doHLTMatching is true
do_resolved_trigger_bucket: true

pairingStrategy: "minDeltaR"
# pairingStrategy: "minTargetMass"

# Toggles for object types
do_small_R_jets: true
do_large_R_UFO_jets: true
do_muons: true
do_photons: false  # Disabled - PhotonOriginCorrectionAlg requires '::m' variable that doesn't exist

Small_R_jet:
  min_pT: 1.e+3
  max_eta: 4.5
  btag_wp: "GN2v01_FixedCutBEff_77"
  btag_extra_wps:
    - GN2v01_FixedCutBEff_70
    # - GN2v01_FixedCutBEff_77
  doL1Matching: true
  doHLTMatching: true
  saveTriggerInfo: true

Large_R_jet:
  min_pT: 200.e+3
  max_eta: 2.0
  runMuonJetPtCorr: true
  do_thinning: true
  GN2X_hbb_wps:
    - "FlatMassQCDEff_0p25"
    - "FlatMassQCDEff_0p3"
    - "FlatMassQCDEff_0p37"
    - "FlatMassQCDEff_0p46"
    - "FlatMassQCDEff_0p58"
    - "FlatMassQCDEff_0p74"
    - "FlatMassQCDEff_0p94"
    - "FlatMassQCDEff_1p25"
    - "FlatMassQCDEff_1p55"

Muon:
  ID: "Loose"
  Iso: "PflowLoose_VarRad"

# photon ID and isolation requirements
Photon:
  ID: "Tight" # Loose, Tight
  Iso: "FixedCutLoose"


# list of triggers per year to consider
Trigger:
  include: [bbbbbbAnalysis/triggers-resolved.yaml]

# can alternatively use the CutList to filter events to get trigger eff
do_trigger_filtering: true
bypass: false
save_cutflow: true
selection_name: "preselection"
CutList:
  - PASS_TRIGGER
  # - AT_LEAST_SIX_JETS
  # - AT_LEAST_FOUR_BJETS
  # - AT_LEAST_SIX_BJETS
  # - AT_LEAST_FOUR_JETS_OR_TWO_LRJETS
  # - AT_LEAST_SIX_JETS_OR_THREE_LRJETS
  # - AT_LEAST_SIX_JETS_TWO_BJETS

do_overlap_removal: true

do_CP_systematics: false
systematics_regex: [".*"]

Exclude2015: true

GRL:
  years:
    include: [EasyjetHub/bjet_grl_years.yaml]

# Alternative PRW configuration
PileupReweighting:
  extra_prw:
    - postfix: "bjet"
      lumicalc_files:
        include: [EasyjetHub/lumicalc_bjet.yaml]
      prw_files:
        include: [EasyjetHub/prw_bjet.yaml]

# Include the TTree configuration and update details
ttree_output:
  # Our overrides. All defaults are off
  reco_outputs:
    small_R_jets: 'container_names.output.reco4PFlowJet'
    large_R_UFO_jets: 'container_names.output.reco10UFOJet'
    # photons: removed - do_photons=false
  collection_options:
    small_R_jets:
      truth_parent_info: true
      btag_info: true
      JVT_details: true
      no_bjet_calib_p4: true
      btag_details: true
      gn3_scores: false
    large_R_jets:
      truth_parent_info: true
      btag_info: true
      JVT_details: true
      no_bjet_calib_p4: true
      btag_details: true
      gn3_scores: false
      extra_variables:
        - [GN2v01_pb, float]
        - [GN2v01_pc, float]
        - [GN2v01_ptau, float]
        - [GN2v01_pu, float]
    # photons: removed - do_photons=false
  truth_outputs:
    small_R_jets: 'container_names.input.truth4Jet'
    large_R_jets: 'container_names.input.truth10SoftDropJet'
    higgs_particle: 'container_names.output.truthHHParticles'
