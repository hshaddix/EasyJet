include: [EasyjetHub/base-config.yaml]

# Which analysis to consider
do_ssWW_analysis: true

bypass: false

expert_mode_warning_level: ignore

store_high_level_variables: true

# Toggles for object types
do_small_R_jets: true
do_muons: true
do_electrons: true
do_met : true
do_VgammaOR: true
VGammaOR_dR_lepton_photon_cuts: [0.1, 0.2]
add_BadBatman_jet_cleaning: false

# Toggles for reconstructed objects decorations
Small_R_jet:
  min_pT: 20.e+3  # for the jets entering the MET computation and the overlap removal
  max_eta: 4.5
  min_pT_ssWW: 20.e+3 # for the jet selection
  max_eta_ssWW: 4.5
  useFJvt: True
  # btagging working points 
  btag_wp: "GN2v01_FixedCutBEff_90"
  amount: 2
  amount_bjet: 0
  # to use multiple btagging WPs
  btag_extra_wps:
    - GN2v01_FixedCutBEff_77
    - GN2v01_FixedCutBEff_70
    - GN2v01_FixedCutBEff_85
    
  variables_int_bjets: ["truthLabel"]
  variables_truthjets: ["pt", "eta", "phi", "E"]

Electron:
  maxD0Significance: 5 
  maxDeltaZ0SinTheta: 0.5
  ID: "LooseDNN"
  Iso: "NonIso"
  min_pT: 4.5e+3
  min_pT_ssWW: 4.5e+3
  do_IFF_decoration: true
  max_eta_ssWW: 2.47
  chargeIDSelectionRun2: false #Set to false for investigating charge MisID 
  do_track_decoration: true

  extra_wps:
  - ["TightDNN", "Tight_VarRad"]
  - ["TightDNN", "Loose_VarRad"]
  - ["TightDNN", "NonIso"]
  - ["MediumDNN", "Tight_VarRad"]
  - ["MediumDNN", "Loose_VarRad"]
  - ["MediumDNN", "NonIso"]
  - ["LooseDNN", "Tight_VarRad"]
  - ["LooseDNN", "Loose_VarRad"]
  - ["TightLH", "Tight_VarRad"]  # previously Gradient. The fisrt one is used to define the pass-ID region
  - ["TightLH", "Loose_VarRad"]  
  - ["MediumLH", "Tight_VarRad"]  
  - ["MediumLH", "Loose_VarRad"]  
  - ["MediumLH", "NonIso"] 
  - ["LooseBLayerLH", "NonIso"] 

Muon:
  maxD0Significance: 15
  maxDeltaZ0SinTheta: 1.5
  ID: "Loose"
  Iso: "NonIso"
  min_pT: 3.e+3
  max_eta: 2.5 # no recommendation yet for forward muons with eta between 2.5 and 2.7.
  min_pT_ssWW: 5.e+3
  max_eta_ssWW: 2.5 # no recommendation yet for forward muons with eta between 2.5 and 2.7.
  do_IFF_decoration: true

  extra_wps:
  - ["Medium", "PflowTight_VarRad", 3, 0.5] # previously FixedCutPflowTight. The fisrt one is used to define the pass-ID region
  - ["Medium", "PflowLoose_VarRad"]
  - ["Loose", "PflowTight_VarRad"] 
  - ["Loose", "PflowLoose_VarRad",]

Lepton:
  amount: 3
  variables_int: ["isPrompt","truthOrigin", "truthType", "ele_ECIDS"]
  variables_truth: ["pt", "eta", "phi", "E", "m"]

Met:
  saveSignificance: true

# list of triggers per year to consider
Trigger:
  include: [ssWWAnalysis/trigger.yaml]
# apply trigger lists to filter events
do_trigger_filtering: true

# write objects with overlap removal applied
# turning this on you have to decide on one large R jet collection
do_overlap_removal: true

#Enable cutflow 
save_cutflow: true

CutList :
  - PASS_TRIGGER
  - PASS_TWO_LEPTONS
  - PASS_LEPTON_ID
  - EXACTLY_TWO_LEPTONS
  - TWO_SAME_CHARGE_LEPTONS
  - DILEPTON_MASS_THRESHOLD
  - DILEPTON_MASS_SIDEBAND_EE
  - AT_LEAST_TWO_JETS
  - DIJETS_MASS_LOW
  - MET
  - BJET_VETO
  - DIJETS_DELTA_RAPIDITY
  - DIJETS_MASS_HIGH

Categories :
  - IS_ee
  - IS_mm
  - IS_em
  - IS_me

TruthCutList :
  - EXACTLY_TWO_LEPTONS_TRUTH
  - SAME_CHARGE_LEPTONS_TRUTH
  - DILEPTON_MASS_TRUTH
  - MET_TRUTH
  - TWO_JETS_TRUTH
  - DIJET_MASS_TRUTH
  - DIJET_RAPIDITY_TRUTH

TruthCategories :
  - IS_ee_TRUTH
  - IS_mm_TRUTH
  - IS_em_TRUTH

truth_neutrino_container: TruthNeutrinos

truth_w_vars_dsid_samples:
  - 545684
  - 545685
  - 545686
  - 561757

# Include the TTree configuration and update details
ttree_output:
  include: [EasyjetHub/AnalysisMiniTree-config.yaml]
  # Our overrides. All defaults are off
  slim_variables_with_syst: true
  reco_outputs:
    small_R_jets: 'container_names.output.reco4PFlowJet'
    muons: 'container_names.output.muons'
    electrons: 'container_names.output.electrons'
    met : 'container_names.output.met'
  collection_options:
    small_R_jets:
      btag_info: true
      # JVT_details: true
