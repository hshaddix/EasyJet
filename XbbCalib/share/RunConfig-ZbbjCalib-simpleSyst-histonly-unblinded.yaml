# UNBLINDED twin of RunConfig-ZbbjCalib-simpleSyst-histonly.yaml — identical in
# every respect EXCEPT the blinding include, which points at
# blinding-Zbbj-off.yaml (enable: false) instead of blinding-Zbbj.yaml
# (enable: true). The Z->bb peak (74-106 GeV BJR mass) is therefore KEPT in the
# data histograms rather than zeroed.
#
# Why this file exists (not just appending -off on top of the blinded base):
# easyjet YAML `include` CONCATENATES list values (local += parent), so a
# child config CANNOT un-blind by re-declaring `blinding.include` on top of
# RunConfig-ZbbjCalib-simpleSyst-histonly.yaml — that would yield
# [blinding-Zbbj.yaml, blinding-Zbbj-off.yaml] with fragile order-dependent
# merge behaviour. Instead this file mirrors the established
# histonly-config-Zbbj-unblinded.yaml pattern: a standalone base that only
# ever includes the -off blinding config, so downstream configs that need
# unblinded data (e.g. RunConfig-ZbbjCalib-simpleSyst-gn3xBjr-histonly.yaml)
# can include THIS file instead of the blinded default.
#
# The blinded RunConfig-ZbbjCalib-simpleSyst-histonly.yaml is left UNCHANGED
# and remains the framework default for other users.
include: [XbbCalib/RunConfig-ZbbjCalib-simpleSyst.yaml]

# Output ALL scheduled systematics (inherits the parent's '.*'). The large-R
# NP reduction is handled by the Simple model knobs in the parent config, not
# by this regex, so '.*' keeps the reduced large-R set and retains every other
# systematic (small-R JES, b-tag/pileup/lepton weights) on the calibration
# histograms.
do_CP_systematics: true
systematics_regex: [".*"]

# Turn on the histogram H5 output (mass_pt_wp_sys per group).
output:
  h5:
    hists:
      enable: true
      include:
        - XbbCalib/hists-config-Zbbj.yaml
      blinding:
        include:
          - XbbCalib/blinding-Zbbj-off.yaml
