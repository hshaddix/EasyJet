disable_metadata: false
selection:
  n_lrjets_min: 1
variables:
  Zcand_0_pt:
    lower: 250000
    upper: 1500000
    n_bins: 50
hists2d:
  Zcand_0_m_vs_GN3XPV01_phbb:
    x:
      variable: Zcand_0_m
      lower: 50000
      upper: 150000
      n_bins: 50
    y:
      variable: Zcand_0_GN3XPV01_phbb
      lower: 0.0
      upper: 1.0
      n_bins: 50
weights:
  all_runs:
    sys: []
    nosys:
      - PileupWeight_NOSYS
  run2:
    sys: []
    nosys:
      - beamSpotWeight

multidim:

  # BJR-pT-binned view
  leading: &leading
    mass_var: Zcand_0_bJR10v01_mass
    mass_lower: 50000
    mass_upper: 150000
    mass_n_bins: 50
    pt_var: Zcand_0_bJR10v01_pt
    pt_edges: [200000., 250000., 350000., 500000., 1500000.]
    wp_prefix: Zcand_0

  # UFO-pT-binned view
  # Same BJR mass observable, but sliced by the UFO large-R jet pT
  leading_ufopt:
    <<: *leading
    pt_var: Zcand_0_pt
