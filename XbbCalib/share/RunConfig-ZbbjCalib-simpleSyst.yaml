include: [XbbCalib/RunConfig_ZbbjCalib.yaml]

# JetEtMiss "simpler" R10 (large-R UFO CSSK SoftDrop) NP set per the
# Summer2025_PreRec recs page:
#   - JES: CategoryReduction (~27+7 NPs — only choice for large-R)
#   - JER: Simple             (12+5 NPs)
#   - JMS: Simple             (2+6 NPs; valid for jet mass < 300 GeV — fine
#                              for Z->bb peak at ~91 GeV)
#   - JMR: Simple             (7 NPs; flat 20% + cross-cal R22+ terms)
#
# AthAnalysis 25.2.91 auto-prefixes large-R uncertainty configs with
# rel22/Summer2025_PreRec/ (both JetUncertaintiesConfig.getUncertaintyToolSettingsLargeRJets
# and LargeRJetAnalysisConfig.createFFSmearingTool), so the model knobs
# alone resolve to:
#   rel22/Summer2025_PreRec/R10_CategoryJES_SimpleJER_SimpleJMS.config
#   rel22/Summer2025_PreRec/R10_SimpleJMR.config
# No explicit uncertToolConfigPath* overrides needed — and avoiding them
# sidesteps the expertMode=True trip-wire on those options.
Large_R_jet:
  systModelJER: "Simple"
  systModelJMS: "Simple"
  systModelJMR: "Simple"

# Produce ALL scheduled systematic variations in the output. The large-R NP
# reduction is done by the Simple model knobs above (systModelJER/JMS/JMR) at
# the JetUncertainties-tool level, NOT by this regex — so '.*' keeps the
# reduced large-R set and additionally retains every other systematic
# (small-R JES, b-tag/pileup/lepton weights) needed for the calibration.
do_CP_systematics: true
systematics_regex: [".*"]
