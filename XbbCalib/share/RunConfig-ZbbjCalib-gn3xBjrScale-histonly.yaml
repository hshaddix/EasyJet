# Synthetic GN3X BJR mass/pT-shift systematics dump (histonly).
#
# NOTE: this config does NOT include RunConfig-ZbbjCalib-simpleSyst-histonly
# because easyjet's YAML include CONCATENATES list values (local += fragment),
# so the parent's `systematics_regex: ['.*']` cannot be overridden -- it would
# survive as ['XBB_BJR_.*', '.*'] and trip consolidate_systematics_regex.
# Instead we include the base RunConfig_ZbbjCalib (no regex set there) and
# re-declare the reduced-large-R "Simple" knobs + histonly output block here,
# so our narrow regex stands alone.
include: [XbbCalib/RunConfig_ZbbjCalib.yaml]

# JetEtMiss "Simple" reduced R10 NP set (matches RunConfig-ZbbjCalib-simpleSyst).
# Functionally irrelevant to the H5 output here (the narrow regex drops all
# JET_ systematics), but keeps the large-R uncertainty-tool setup cheap.
Large_R_jet:
  systModelJER: "Simple"
  systModelJMS: "Simple"
  systModelJMR: "Simple"

# Activate CP systematics and register + populate the synthetic BJR scale
# systematics (Easyjet::BJRKinematicShiftSystAlg).
do_CP_systematics: true
do_bjr_kinematic_shift_syst: true

# NOSYS + our customs only. consolidate_systematics_regex auto-prepends the
# NOSYS (^$) match and forbids passing '^$'/'.*' in a mixed list, so list ONLY
# the custom family. Drops JES/JER/JMS/JMR/GEN from the sys axis -> the H5
# carries just NOSYS + the 4 XBB_BJR_* slices, and the dump is fast.
systematics_regex: ['XBB_BJR_.*']

# Turn on the histogram H5 output (mass_pt_wp_sys per group). No blinding
# block: blinding is only applied on data (MC ignores it in _final_selection),
# and this dump is MC.
output:
  h5:
    hists:
      enable: true
      include:
        - XbbCalib/hists-config-Zbbj.yaml
